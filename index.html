
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#063d30">
<title>Kayı Okey</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle,#126247,#03291f);color:white;font-family:Arial;text-align:center}
header{padding:18px;background:#05271e;border-bottom:2px solid #f4c95d}
.logo{color:#f4c95d;font-size:27px;font-weight:bold;letter-spacing:2px}
.subtitle{font-size:12px;margin-top:5px;color:#c8dfd2}
main{max-width:700px;margin:auto;padding:12px}
.scorebar{display:flex;justify-content:space-between;background:#092f24;padding:12px;border-radius:12px;font-size:13px}
.table{margin-top:14px;padding:18px 10px;min-height:370px;border:9px solid #76502c;border-radius:35px;background:radial-gradient(ellipse,#21865d,#07543d);display:flex;flex-direction:column;justify-content:space-between}
.opponents{display:flex;justify-content:space-around;gap:8px}
.player{min-width:85px;padding:10px 7px;background:#073d2e;border:1px solid #bda76b;border-radius:12px;font-size:12px}
.player strong{display:block;color:#f4c95d;margin-bottom:5px}
.middle{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:14px;padding:20px 0}
.pile{min-width:65px;font-size:12px;color:#f4e7bd}
.tile{width:36px;height:51px;display:inline-flex;align-items:center;justify-content:center;background:#fffdf4;border:2px solid #ded8c7;border-radius:6px;box-shadow:0 3px 5px #0005;font-size:23px;font-weight:900;margin:2px;cursor:pointer;user-select:none}
.red{color:#e32636}.blue{color:#1768c7}.black{color:#222}.yellow{color:#d39b00}
.selected{transform:translateY(-12px);border:3px solid #f4c95d}
#status{padding:12px;margin:12px 0;min-height:44px;color:#ffe49a;background:#063d30;border-radius:10px;font-size:14px}
.section-title{color:#f4c95d;margin:18px 0 8px}
.hand{min-height:85px;padding:12px 3px;display:flex;justify-content:center;flex-wrap:wrap;gap:1px;background:#092f24;border:1px solid #b49c5e;border-radius:12px}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:15px}
button{padding:13px 16px;border:0;border-radius:9px;background:#f4c95d;color:#20251d;font-weight:bold;font-size:14px;cursor:pointer}
button:disabled{opacity:.4}
.footer{padding:20px 5px;color:#b9d3c5;font-size:12px}
@media(max-width:400px){.tile{width:30px;height:44px;font-size:19px;margin:1px}.table{min-height:340px;padding:12px 5px}button{padding:11px;font-size:12px}}
</style>
</head>
<body>
<header>
<div class="logo">🀄 KAYI OKEY</div>
<div class="subtitle">AKILLI RAKİPLER • KLASİK OKEY</div>
</header>
<main>
<div class="scorebar">
<span>🏆 Kayı Okey</span>
<span id="stockCount">Taş havuzu: 0</span>
</div>
<section class="table">
<div class="opponents">
<div class="player"><strong>🤖 ALİ</strong><span id="p0">14 taş</span></div>
<div class="player"><strong>🤖 MEHMET</strong><span id="p1">14 taş</span></div>
<div class="player"><strong>🤖 HASAN</strong><span id="p2">14 taş</span></div>
</div>
<div class="middle">
<div class="pile">GÖSTERGE<div id="indicator"></div></div>
<div class="pile">OKEY<div id="joker"></div></div>
<div class="pile">ATILAN<div id="discard"></div></div>
</div>
<div id="status">Kayı Okey'e hoş geldin!</div>
</section>
<h3 class="section-title">🎴 SENİN TAŞLARIN</h3>
<div id="hand" class="hand"></div>
<div class="controls">
<button onclick="draw()">Taş Çek</button>
<button onclick="take()">Yerden Al</button>
<button onclick="throwTile()">Taş At</button>
<button onclick="newGame()">Yeni Oyun</button>
</div>
<div class="footer">KAYI OKEY © 2026<br>İyi eğlenceler!</div>
</main>

<script>
const COLORS=["red","blue","black","yellow"];
let deck=[],hand=[],bots=[],discard=[];
let indicator,selected=-1,drawn=false,over=false,firstTurn=true;
let wildNumber=0,wildColor=0,thinking=false;

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function tile(n,c,w=false,fake=false){
 return {n,c,w,fake};
}

function isWild(t){return t.w===true;}

function tileHTML(t){
 if(!t)return "";
 return `<span class="tile ${COLORS[t.c]}">${t.fake?"★":t.w?"★":t.n}</span>`;
}

function sortTiles(a){
 a.sort((x,y)=>x.c-y.c||x.n-y.n);
}

function newGame(){
 deck=[];
 for(let set=0;set<2;set++){
  for(let c=0;c<4;c++){
   for(let n=1;n<=13;n++)deck.push(tile(n,c));
  }
 }
 deck.push(tile(0,0,false,true),tile(0,0,false,true));
 shuffle(deck);

 indicator=deck.pop();
 wildNumber=indicator.n===13?1:indicator.n+1;
 wildColor=indicator.c;

 deck.forEach(t=>{
  if(!t.fake&&t.n===wildNumber&&t.c===wildColor)t.w=true;
 });

 // Sahte okeyler, gösterge taşının aynısıdır.
 const fakeTiles=deck.filter(t=>t.fake);
 fakeTiles.forEach(t=>{t.n=indicator.n;t.c=indicator.c;});

 hand=[];
 bots=[[],[],[]];
 discard=[];
 for(let i=0;i<15;i++)hand.push(deck.pop());
 bots.forEach(p=>{for(let i=0;i<14;i++)p.push(deck.pop());});
 discard.push(deck.pop());

 selected=-1;drawn=false;over=false;firstTurn=true;thinking=false;
 sortTiles(hand);
 render();
 say("Oyun başladı. İlk taşını seç ve at!");
}

function say(s){
 document.getElementById("status").textContent=s;
}

function render(){
 document.getElementById("indicator").innerHTML=tileHTML(indicator);
 document.getElementById("joker").innerHTML=
  tileHTML(tile(wildNumber,wildColor,true));
 document.getElementById("discard").innerHTML=
  tileHTML(discard[discard.length-1]);
 document.getElementById("stockCount").textContent="Taş havuzu: "+deck.length;

 bots.forEach((p,i)=>{
  document.getElementById("p"+i).textContent=p.length+" taş";
 });

 const area=document.getElementById("hand");
 area.innerHTML="";
 hand.forEach((t,i)=>{
  const el=document.createElement("span");
  el.className="tile "+COLORS[t.c]+(selected===i?" selected":"");
  el.textContent=t.fake?"★":t.w?"★":t.n;
  el.onclick=()=>{
   if(over||thinking)return;
   selected=selected===i?-1:i;
   render();
  };
  area.appendChild(el);
 });
}

function draw(){
 if(over||thinking||drawn||hand.length!==14||firstTurn){
  say("Şu anda taş çekemezsin.");
  return;
 }
 if(!deck.length){say("Taş havuzu boş!");return;}
 hand.push(deck.pop());
 drawn=true;selected=-1;
 sortTiles(hand);render();
 say("Taş çektin. Şimdi atmak istediğin taşı seç.");
}

function take(){
 if(over||thinking||drawn||hand.length!==14||firstTurn){
  say("Şu anda yerden taş alamazsın.");
  return;
 }
 if(!discard.length)return;
 hand.push(discard.pop());
 drawn=true;selected=-1;
 sortTiles(hand);render();
 say("Yerden taşı aldın. Şimdi bir taş seç ve at.");
}

// Bir taşın eldeki diğer taşlarla uyumunu puanlar.
function tileValue(t,arr,index){
 if(t.w)return 20;
 let score=0;
 for(let i=0;i<arr.length;i++){
  if(i===index)continue;
  const x=arr[i];
  if(x.w){score+=2;continue;}
  if(x.n===t.n&&x.c!==t.c)score+=4;
  if(x.c===t.c){
   const gap=Math.abs(x.n-t.n);
   if(gap===1)score+=4;
   else if(gap===2)score+=1.5;
  }
 }
 return score;
}

// Rakip, en az işe yarayan taşı atmaya çalışır.
function chooseDiscard(p){
 let best=0,bestScore=Infinity;
 for(let i=0;i<p.length;i++){
  const score=tileValue(p[i],p,i);
  if(score<bestScore){
   bestScore=score;
   best=i;
  }
 }
 return best;
}

function aiDraw(p){
 if(!deck.length)return false;
 p.push(deck.pop());
 return true;
}

function aiTurn(){
 if(over)return;
 thinking=true;
 let names=["Ali","Mehmet","Hasan"];
 let moves=[];
 for(let i=0;i<bots.length;i++){
  const p=bots[i];
  if(!aiDraw(p))break;
  const idx=chooseDiscard(p);
  const thrown=p.splice(idx,1)[0];
  discard.push(thrown);
  moves.push(names[i]+" taşlarını değerlendirdi");
 }
 render();
 thinking=false;
 say(moves.length?moves.join(" • ")+" • Sıra sende!":"Sıra sende!");
}

function throwTile(){
 if(over||thinking)return;
 if(!firstTurn&&!drawn){
  say("Önce taş çekmelisin.");
  return;
 }
 if(hand.length!==15){
  say("Atılacak taş bulunamadı.");
  return;
 }
 if(selected<0){
  say("Lütfen atmak istediğin taşı seç.");
  return;
 }
 const thrown=hand.splice(selected,1)[0];
 discard.push(thrown);
 selected=-1;drawn=false;firstTurn=false;
 render();
 say("Taşını attın. Rakipler düşünüyor...");
 setTimeout(aiTurn,700);
}

newGame();
</script>
</body>
</html>
