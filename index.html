
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071d19">
<title>Kayı Okey</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(circle at top,#174d3d,#061b17 75%);
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
 min-height:100vh;
}
header{
 padding:17px 10px;
 background:#071d19;
 border-bottom:2px solid #d9b65c;
}
.logo{
 font-size:29px;
 font-weight:900;
 color:#f4d47e;
 letter-spacing:3px;
}
.subtitle{
 font-size:10px;
 letter-spacing:2px;
 color:#b9c9bd;
 margin-top:6px;
}
main{max-width:760px;margin:auto;padding:12px}
.scorebar{
 display:flex;
 justify-content:space-between;
 background:#102e25;
 border:1px solid #9b8045;
 border-radius:12px;
 padding:12px 14px;
 font-size:13px;
}
.table{
 margin-top:14px;
 padding:17px 8px;
 min-height:390px;
 border:9px solid #674322;
 border-radius:35px;
 background:radial-gradient(ellipse at center,#27825a,#07513c 75%);
 display:flex;
 flex-direction:column;
 justify-content:space-between;
}
.opponents{display:flex;justify-content:space-around;gap:6px}
.player{
 flex:1;
 min-width:0;
 max-width:160px;
 padding:10px 3px;
 background:linear-gradient(145deg,#123c30,#08271f);
 border:1px solid #c5a65b;
 border-radius:13px;
 font-size:12px;
}
.player strong{
 display:block;
 color:#f4d47e;
 margin-bottom:6px;
}
.rack{
 display:flex;
 justify-content:center;
 align-items:center;
 flex-wrap:nowrap;
 gap:1px;
 margin-top:9px;
 min-height:29px;
 padding:4px 2px;
 background:#061e18;
 border-radius:5px;
 overflow:hidden;
}
.back-tile{
 width:7px;
 height:23px;
 flex:0 0 7px;
 border:1px solid #e0c477;
 border-radius:3px;
 background:repeating-linear-gradient(45deg,#174b86,#174b86 3px,#2869a5 3px,#2869a5 6px);
}
.middle{
 display:flex;
 justify-content:center;
 align-items:center;
 flex-wrap:wrap;
 gap:13px;
 padding:20px 0;
}
.pile{
 min-width:77px;
 padding:9px 5px;
 background:#063d2d88;
 border:1px solid #ffffff25;
 border-radius:12px;
 font-size:10px;
 color:#f5dfaa;
}
.tile{
 width:36px;
 height:52px;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#fff,#e9e5d8);
 border:1px solid #bdb8a8;
 border-radius:6px;
 box-shadow:0 3px 5px #0006;
 font-size:23px;
 font-weight:900;
 margin:2px;
 cursor:pointer;
 user-select:none;
 color:#222;
}
.red{color:#e32636}
.blue{color:#1768c7}
.black{color:#222}
.yellow{color:#c28b00}
.selected{
 transform:translateY(-10px);
 border:3px solid #f4c95d;
}
#status{
 padding:13px;
 margin:12px 0;
 min-height:46px;
 color:#ffe7a6;
 background:#082b21;
 border:1px solid #9b8045;
 border-radius:11px;
 font-size:13px;
 line-height:1.5;
}
.section-title{
 color:#f4d47e;
 font-size:16px;
 margin:22px 0 10px;
}
.hand{
 min-height:94px;
 padding:13px 4px;
 display:flex;
 justify-content:center;
 align-items:center;
 flex-wrap:wrap;
 gap:1px;
 background:linear-gradient(145deg,#102f25,#071f19);
 border:1px solid #b49c5e;
 border-radius:14px;
}
.controls{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
 margin-top:15px;
}
button{
 padding:14px 8px;
 border:1px solid #ffe5a0;
 border-radius:10px;
 background:linear-gradient(145deg,#f8dc8c,#c99c3d);
 color:#282318;
 font-weight:900;
 font-size:14px;
 cursor:pointer;
}
button:last-child{
 background:linear-gradient(145deg,#315b4b,#173b30);
 color:white;
 border-color:#7ba58e;
}
.footer{
 padding:22px 5px;
 color:#9bb7a8;
 font-size:11px;
}
@media(max-width:400px){
 .tile{width:29px;height:43px;font-size:18px;margin:1px}
 .table{min-height:350px;padding:12px 5px}
 .player{font-size:10px;padding:9px 2px}
 .back-tile{width:6px;flex-basis:6px;height:20px}
 button{padding:13px 5px;font-size:12px}
 .logo{font-size:25px}
}
</style>
</head>

<body>
<header>
 <div class="logo">🀄 KAYI OKEY</div>
 <div class="subtitle">101 OKEY • AKILLI RAKİPLER</div>
</header>

<main>
 <div class="scorebar">
  <span>🏆 OKEY MASASI</span>
  <span id="stockCount">Taş havuzu: 0</span>
 </div>

 <section class="table">
  <div class="opponents">
   <div class="player">
    <strong>🤖 ALİ</strong>
    <span id="p0">21 taş</span>
    <div class="rack" id="rack0"></div>
   </div>
   <div class="player">
    <strong>🤖 MEHMET</strong>
    <span id="p1">21 taş</span>
    <div class="rack" id="rack1"></div>
   </div>
   <div class="player">
    <strong>🤖 HASAN</strong>
    <span id="p2">21 taş</span>
    <div class="rack" id="rack2"></div>
   </div>
  </div>

  <div class="middle">
   <div class="pile">GÖSTERGE<div id="indicator"></div></div>
   <div class="pile">OKEY<div id="joker"></div></div>
   <div class="pile">ATILAN<div id="discard"></div></div>
  </div>

  <div class="section-title">🎯 MASAYA AÇILAN PERLER</div>
  <div id="openedMelds" class="hand"></div>

  <div id="status">Kayı Okey'e hoş geldin!</div>

  <div class="section-title">🀄 SENİN ISTAKAN</div>
  <div id="hand" class="hand"></div>

  <div class="controls">
   <button onclick="open101()">🎯 101 AÇ</button>
   <button onclick="draw()">⬇ Taş Çek</button>
   <button onclick="take()">↗ Yerden Al</button>
   <button onclick="throwTile()">🀄 Taş At</button>
   <button onclick="newGame()">🔄 Yeni Oyun</button>
  </div>

  <div class="footer">KAYI OKEY © 2026<br>İyi eğlenceler!</div>
 </section>
</main>

<script>
"use strict";

const COLORS=["red","blue","black","yellow"];

let deck=[],hand=[],bots=[],discard=[];
let openedMelds=[];
let indicator;
let selected=-1;
let drawn=false;
let over=false;
let firstTurn=true;
let openingSelection=[];
let wildNumber=0,wildColor=0;
let thinking=false;
let hasOpened=false;

function tile(n,c,w=false,fake=false){
 return {n:Number(n),c:Number(c),w:Boolean(w),fake:Boolean(fake)};
}

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function sortTiles(a){
 a.sort((x,y)=>x.c-y.c||x.n-y.n);
}

function say(s){
 document.getElementById("status").textContent=s;
}

function tileHTML(t){
 if(!t)return "";
 const value=t.w?"★":t.n;
 return `<span class="tile ${COLORS[t.c]}">${value}</span>`;
}

function newGame(){
 deck=[];

 for(let set=0;set<2;set++){
  for(let c=0;c<4;c++){
   for(let n=1;n<=13;n++){
    deck.push(tile(n,c));
   }
  }
 }

 deck.push(tile(0,0,false,true));
 deck.push(tile(0,0,false,true));

 shuffle(deck);

 const idx=deck.findIndex(t=>!t.fake);
 indicator=deck.splice(idx,1)[0];

 wildNumber=indicator.n===13?1:indicator.n+1;
 wildColor=indicator.c;

 deck.forEach(t=>{
  if(!t.fake&&t.n===wildNumber&&t.c===wildColor){
   t.w=true;
  }
  if(t.fake){
   t.n=indicator.n;
   t.c=indicator.c;
  }
 });

 hand=[];
 bots=[[],[],[]];
 discard=[];
 openedMelds=[];

 for(let i=0;i<22;i++)hand.push(deck.pop());

 bots.forEach(p=>{
  for(let i=0;i<21;i++)p.push(deck.pop());
 });

 discard.push(deck.pop());

 selected=-1;
 openingSelection=[];
 drawn=false;
 firstTurn=true;
 over=false;
 thinking=false;
 hasOpened=false;

 sortTiles(hand);
 render();

 say("Oyun başladı! Havuzda "+deck.length+" taş var.");
 console.log("Dağıtım:",{
  havuz:deck.length,
  oyuncu:hand.length,
  rakipler:bots.map(p=>p.length),
  toplam:deck.length+hand.length+bots.reduce((s,p)=>s+p.length,0)+1+1
 });
}

function render(){
 document.getElementById("indicator").innerHTML=tileHTML(indicator);
 document.getElementById("joker").innerHTML=
 tileHTML({n:wildNumber,c:wildColor,w:true});
 document.getElementById("discard").innerHTML=
 tileHTML(discard[discard.length-1]);

 document.getElementById("stockCount").textContent=
 "Taş havuzu: "+deck.length;

 bots.forEach((p,i)=>{
  document.getElementById("p"+i).textContent=p.length+" taş";
  const rack=document.getElementById("rack"+i);
  rack.innerHTML="";
  p.forEach(()=>{
   const t=document.createElement("span");
   t.className="back-tile";
   rack.appendChild(t);
  });
 });

 const opened=document.getElementById("openedMelds");
 opened.innerHTML="";
 openedMelds.forEach(meld=>{
  const group=document.createElement("div");
  group.style.display="flex";
  group.style.flexWrap="wrap";
  group.innerHTML=meld.map(tileHTML).join("");
  opened.appendChild(group);
 });

 const area=document.getElementById("hand");
 area.innerHTML="";

 hand.forEach((t,i)=>{
  const el=document.createElement("span");
  el.className="tile "+COLORS[t.c]+
   (selected===i||openingSelection.includes(i)?" selected":"");
  el.textContent=t.w?"★":t.n;
  el.onclick=()=>{
   if(over||thinking)return;
   if(openingSelection.includes(i)){
    openingSelection=openingSelection.filter(x=>x!==i);
   }else{
    openingSelection.push(i);
   }
   selected=i;
   render();
  };
  area.appendChild(el);
 });
}

function draw(){
 if(over||thinking||firstTurn||drawn||hand.length!==21){
  say("Şu anda taş çekemezsin.");
  return;
 }
 if(!deck.length){
  say("Taş havuzu boş!");
  return;
 }
 hand.push(deck.pop());
 drawn=true;
 selected=-1;
 sortTiles(hand);
 render();
 say("Taş çektin. Şimdi taş at.");
}

function take(){
 if(over||thinking||firstTurn||drawn||hand.length!==21){
  say("Şu anda yerden taş alamazsın.");
  return;
 }
 if(!discard.length)return;

 hand.push(discard.pop());
 drawn=true;
 selected=-1;
 sortTiles(hand);
 render();
 say("Yerden taşı aldın. Şimdi taş at.");
}

function throwTile(){
 if(over||thinking)return;

 if(selected<0||selected>=hand.length){
  say("Önce atacağın taşı seç.");
  return;
 }

 if(!firstTurn&&!drawn){
  say("Önce taş çekmelisin.");
  return;
 }

 const thrown=hand.splice(selected,1)[0];
 discard.push(thrown);

 selected=-1;
 openingSelection=[];
 drawn=false;

 render();

 if(hand.length===0){
  over=true;
  say("Oyunu kazandın!");
  return;
 }

 firstTurn=false;
 say("Taşını attın. Rakipler oynuyor.");

 setTimeout(aiTurn,500);
}

function isValidGroup(group){
 if(group.length<3||group.length>13)return false;

 const normal=group.filter(t=>!t.w);
 const jokers=group.length-normal.length;

 if(!normal.length)return false;

 if(group.length<=4){
  const sameNumber=normal.every(t=>t.n===normal[0].n);
  const colors=new Set(normal.map(t=>t.c));
  if(sameNumber&&colors.size===normal.length&&
     jokers<=4-normal.length)return true;
 }

 if(!normal.every(t=>t.c===normal[0].c))return false;

 const nums=normal.map(t=>t.n);
 if(new Set(nums).size!==nums.length)return false;

 for(let start=1;start<=14-group.length;start++){
  const positions=nums.map(n=>n-start);
  if(positions.every(p=>p>=0&&p<group.length)){
   if(new Set(positions).size===normal.length&&
      group.length-normal.length===jokers)return true;
  }
 }

 return false;
}

function canMakeMelds(tiles){
 if(tiles.length===0)return false;

 function search(remaining){
  if(!remaining.length)return true;
  if(remaining.length<3)return false;

  const first=remaining[0];

  function build(start,group){
   if(group.length>=3&&isValidGroup(group)){
    const rest=remaining.filter(t=>!group.includes(t));
    if(search(rest))return true;
   }

   for(let i=start;i<remaining.length;i++){
    if(build(i+1,[...group,remaining[i]]))return true;
   }
   return false;
  }

  return build(1,[first]);
 }

 return search(tiles);
}

function open101(){
 if(hasOpened){
  say("Zaten açılış yaptın.");
  return;
 }

 if(openingSelection.length<6){
  say("En az 6 taş seçmelisin.");
  return;
 }

 const tiles=openingSelection.map(i=>hand[i]);
 const total=tiles.reduce((s,t)=>s+(t.w?wildNumber:t.n),0);

 if(total<101){
  say("Toplam "+total+". 101 puana ulaşmalısın.");
  return;
 }

 if(!canMakeMelds(tiles)){
  say("Seçtiğin taşlar geçerli perlere ayrılamıyor.");
  return;
 }

 openedMelds.push(tiles.map(t=>({...t})));

 openingSelection.slice().sort((a,b)=>b-a).forEach(i=>{
  hand.splice(i,1);
 });

 openingSelection=[];
 selected=-1;
 hasOpened=true;
 render();
 say("101 açıldı! Toplam: "+total);
}

function chooseDiscard(p){
 let best=0,score=Infinity;
 p.forEach((t,i)=>{
  let value=t.w?1000:t.n;
  p.forEach((x,j)=>{
   if(i===j||x.w)return;
   if(x.n===t.n&&x.c!==t.c)value+=4;
   if(x.c===t.c&&Math.abs(x.n-t.n)<=2)value+=3;
  });
  if(value<score){score=value;best=i;}
 });
 return best;
}

function aiTurn(){
 if(over)return;
 thinking=true;

 const names=["Ali","Mehmet","Hasan"];
 const moves=[];

 for(let i=0;i<bots.length;i++){
  const p=bots[i];
  if(!deck.length)break;

  p.push(deck.pop());
  const idx=chooseDiscard(p);
  discard.push(p.splice(idx,1)[0]);
  moves.push(names[i]+" oynadı");
 }

 thinking=false;
 render();
 say(moves.length?moves.join(" • ")+" • Sıra sende!":"Sıra sende!");
}

newGame();

</script>
</body>
</html>
