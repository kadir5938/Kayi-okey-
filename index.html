function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }

}

 return {

 deck.push(tile(0,0,false,true));

 shuffle(deck);

 wildColor=indicator.c;

 deck.forEach(t=>{
  if(!t.fake && t.n===wildNumber && t.c===wildColor){

 hand=[];

 for(let i=0;i<22;i++){

 selected=-1;

console.log("ISTAKA:",hand.length);

function say(s){
 document.getElementById("status").textContent=s;
}

function render(){
 document.getElementById("indicator").innerHTML=tileHTML(indicator);

 document.getElementById("joker").innerHTML=
 tileHTML({n:wildNumber,c:wildColor});

 document.getElementById("discard").innerHTML=
 tileHTML(discard[discard.length-1]);

 document.getElementById("stockCount").textContent=
 "Taş havuzu: "+deck.length;

 bots.forEach((p,i)=>{
  document.getElementById("p"+i).textContent=p.length+" taş";

  const rack=document.getElementById("rack"+i);
  rack.innerHTML="";

  p.forEach(()=>{
   const t=document.createElement("span");
   t.className="back-tile";
   rack.appendChild(t);
  });
 });

 const area=document.getElementById("hand");
 area.innerHTML="";

 console.log("ISTAKA TAŞ SAYISI:",hand.length);

 hand.forEach((t,i)=>{
  const el=document.createElement("span");

  el.className="tile "+COLORS[t.c]+
  (selected===i||openingSelection.includes(i)?" selected":"");

  el.textContent=t.n;

  el.onclick=()=>{
   if(over||thinking)return;

   if(openingSelection.includes(i)){
    openingSelection=openingSelection.filter(x=>x!==i);
   }else{
    openingSelection.push(i);
   }

   selected=i;
   render();
  };

  area.appendChild(el);
 });
}

function draw(){

 if(over||thinking||drawn||hand.length!==21){
  say("Şu anda taş çekemezsin.");
  return;
 }
 if(!deck.length){
  say("Taş havuzu boş!");
  return;
 }

 hand.push(deck.pop());
 drawn=true;
 selected=-1;
 sortTiles(hand);
 render();
 say("Taş çektin. Şimdi atmak istediğin taşı seç.");
}

function take(){
if(over||thinking||drawn||hand.length!==21||firstTurn){
  say("Şu anda yerden taş alamazsın.");
  return;
 }
 if(!discard.length)return;

 hand.push(discard.pop());
 drawn=true;
 selected=-1;
 sortTiles(hand);
 render();
 say("Yerden taşı aldın. Şimdi bir taş seç ve at.");
}

}

function isValidGroup(group){
 if(!Array.isArray(group))return false;

 const len=group.length;
 if(len<3 || len>13)return false;

 const normal=group.filter(t=>!t.w&&!t.fake);
 const jokers=len-normal.length;

 if(normal.length===0)return false;

 // SIRALI PER: Aynı renk, farklı sayılar
 let sequence=false;

 if(normal.every(t=>t.c===normal[0].c)){
  const nums=normal.map(t=>Number(t.n)).sort((a,b)=>a-b);

  if(new Set(nums).size===nums.length){
   const missing=nums[nums.length-1]-nums[0]+1-normal.length;
   const extra=jokers-missing;
   const available=(nums[0]-1)+(13-nums[nums.length-1]);

   sequence=missing>=0 && extra>=0 && extra<=available;
  }
 }

 // AYNI SAYI: Farklı renkler
 let set=false;

 if(len<=4 && normal.every(t=>t.n===normal[0].n)){
  const colors=new Set(normal.map(t=>t.c));
  set=colors.size===normal.length &&
      jokers<=4-normal.length;
 }

function chooseDiscard(p){
 let best=0,bestScore=Infinity;

 for(let i=0;i<p.length;i++){
  const score=tileValue(p[i],p,i);
  if(score<bestScore){
   bestScore=score;
   best=i;
  }
 }
 return best;
}

function aiDraw(p){
 if(!deck.length)return false;
 p.push(deck.pop());
 return true;
}
       
function aiTurn(){
 if(over)return;
 thinking=true;
 let names=["Ali","Mehmet","Hasan"],moves=[];
 for(let i=0;i<bots.length;i++){
  const p=bots[i];
  if(!aiDraw(p))break;
  const idx=chooseDiscard(p);
  discard.push(p.splice(idx,1)[0]);
  moves.push(names[i]+" taşlarını değerlendirdi");
 }
 render();
 thinking=false;
 say(moves.length?moves.join(" • ")+" • Sıra sende!":"Sıra sende!");
}
 

function canMakeMelds(tiles){
 if(!Array.isArray(tiles))return false;
 if(tiles.length===0)return true;
 if(tiles.length<3)return false;

 const memo=new Map();

 function search(indices){
  if(indices.length===0)return true;

  const key=indices.join(",");
  if(memo.has(key))return memo.get(key);
  if(indices.length<3)return false;

  let found=false;
  const first=indices[0];

  function build(start,group,used){
   if(found)return;

   if(group.length>=3 && isValidGroup(group)){
    const remaining=indices.filter(i=>!used.includes(i));

    if(search(remaining)){
     found=true;
     return;
    }
   }

   if(group.length>=13)return;

   for(let j=start;j<indices.length;j++){
    const idx=indices[j];

    build(
     j+1,
     [...group,tiles[idx]],
     [...used,idx]
    );

    if(found)return;
   }
  }

  build(1,[tiles[first]],[first]);
  memo.set(key,found);
  return found;
 }

 return search(tiles.map((t,i)=>i));
}
 
function open101(){
 const tiles=openingSelection.map(i=>hand[i]);

 if(tiles.length<6){
  say("En az iki geçerli per seçmelisin.");
  return;
 }

 const total=tiles.reduce((sum,t)=>sum+t.n,0);

 if(total<101){
  say("Toplam "+total+". 101 puana ulaşmalısın.");
  return;
 }

 if(!canMakeMelds(tiles)){
  say("Seçtiğin taşlar geçerli perlere ayrılamıyor.");
  return;
 }

 say("Tebrikler! 101 açılışın geçerli. Toplam: "+total);
}
function throwTile(){
 if(over||thinking)return;

 if(!firstTurn&&!drawn){
  say("Önce taş çekmelisin.");
  return;
 }

 if(selected<0){
  say("Lütfen atmak istediğin taşı seç.");
  return;
 }

 if(hand.length!==21 && hand.length!==22){
  return;
 }

 discard.push(hand.splice(selected,1)[0]);

 selected=-1;
 drawn=false;
 firstTurn=false;

 render();
 say("Taşını attın. Rakipler düşünüyor...");

 setTimeout(aiTurn,700);
}
